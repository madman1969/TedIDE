# cc65's plus4.cfg (zlib licence) with a fixed place for WorldMap's second screen and character
# set (the VIDEO segment, screen_plus4.c): $1800-$1FFF and $2000-$23FF, right after the start-up
# code. The TED reads the screen from ROM instead of RAM above $8000 while the ROMs are paged in,
# as they are in every interrupt, so these have to be below $8000; left in the BSS, they moved up
# as the program grew, and would have gone past it. Here they also stay below $4000, the part of
# memory the Hannes and Csory RAM expansions never remap. They're in the program file, as
# everything else is loaded after them, so it's 3K or so longer than it would be.
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0200; # 512-byte stack: WorldMap's deepest use, measured in VICE
                                               # (generating, scrolling, drawing ahead), is under 128 bytes
    __HIMEM__:     type = weak, value = $FD00;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002, size = $001A;
    LOADADDR: file = %O,               start = $0FFF, size = $0002;
    HEADER:   file = %O, define = yes, start = $1001, size = $000C;
    LOW:      file = %O, fill = yes,   start = $100D, size = $1800 - $100D;
    VIDEO:    file = %O, fill = yes,   start = $1800, size = $0C00;
    MAIN:     file = %O, define = yes, start = $2400, size = __HIMEM__ - $2400 - __STACKSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = LOW,      type = ro;
    LOWCODE:  load = LOW,      type = ro,  optional = yes;
    ONCE:     load = LOW,      type = ro,  optional = yes;
    VIDEO:    load = VIDEO,    type = bss, align = $0800;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = bss;
    BSS:      load = MAIN,     type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
